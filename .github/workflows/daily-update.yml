name: Daily stock research update + GitHub Pages

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "config/**"
      - "index.html"
      - "data/**"
      - ".github/workflows/daily-update.yml"
      - ".nojekyll"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-research-daily
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Update market data
        run: python scripts/update_data.py

      - name: Sync embedded fallback
        run: python scripts/embed_fallback.py

      - name: Validate project
        run: python scripts/validate_project.py

      - name: Commit verified data
        run: |
          if git diff --quiet; then
            echo "No verified changes"
          else
            git config user.name "stock-research-bot"
            git config user.email "stock-research-bot@users.noreply.github.com"
            git add data/market-data.json index.html QA_REPORT.md
            git commit -m "chore: daily verified market data"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
