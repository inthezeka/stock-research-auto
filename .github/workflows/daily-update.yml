name: Daily stock research update + GitHub Pages

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST · overnight refresh
    - cron: "30 8 * * 1-5" # 17:30 KST · after Korea market close
    - cron: "15 22 1 * *" # 07:15 KST on the 1st · monthly theme refresh using prior month close
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "config/**"
      - "index.html"
      - "data/**"
      - ".github/workflows/daily-update.yml"
      - ".nojekyll"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-research-daily
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Refresh sector membership
        if: github.event_name != 'push'
        env:
          THEME_MONTHLY_REFRESH: ${{ github.event.schedule == '15 22 1 * *' && '1' || '0' }}
        run: python scripts/refresh_sector_membership.py

      - name: Update market data
        env:
          THEME_MONTHLY_REFRESH: ${{ github.event.schedule == '15 22 1 * *' && '1' || '0' }}
        run: python scripts/update_data.py

      - name: Refresh MY Trading intraday cache
        if: github.event_name != 'push'
        run: python scripts/update_intraday_cache.py

      - name: Refresh 3-month analyst research cache
        if: github.event_name != 'push'
        run: python scripts/update_analyst_research_cache.py

      - name: Sync embedded fallback
        if: github.event_name != 'push'
        run: python scripts/embed_fallback.py

      - name: Validate project
        run: python scripts/validate_project.py

      - name: Commit verified data
        if: github.event_name != 'push'
        env:
          THEME_MONTHLY_REFRESH: ${{ github.event.schedule == '15 22 1 * *' && '1' || '0' }}
        run: |
          git config user.name "stock-research-bot"
          git config user.email "stock-research-bot@users.noreply.github.com"

          # A manual/code commit may land while this workflow is generating data.
          # If main advanced, discard the stale generated workspace, move to the
          # latest main, and regenerate once so code + data stay consistent.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during data generation; regenerating on latest main"
            git reset --hard origin/main
            python scripts/refresh_sector_membership.py
            python scripts/update_data.py
            python scripts/update_intraday_cache.py
            python scripts/update_analyst_research_cache.py
            python scripts/embed_fallback.py
            python scripts/validate_project.py
          fi

          if git diff --quiet; then
            echo "No verified changes"
          else
            git add config/fundamental_themes.json data/market-data.json data/intraday-cache.json data/analyst-research-cache.json stock-universe.json index.html QA_REPORT.md
            git commit -m "chore: daily verified market data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
